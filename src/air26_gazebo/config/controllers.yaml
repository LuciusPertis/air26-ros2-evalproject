# Controllers loaded by the gazebo_ros2_control controller_manager (M2).
# Geometry mirrors the shared URDF / air26_bringup params.yaml.

controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # base: front-steered, rear-driven Ackermann. Consumes /cmd_vel (relayed to
    # its reference_unstamped input in gazebo.launch.py).
    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    # arm: tracks /arm_controller/joint_trajectory (frozen behavior topic).
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

ackermann_steering_controller:
  ros__parameters:
    use_sim_time: true
    reference_timeout: 0.5            # matches the MuJoCo driver cmd_timeout
    front_steering: true
    open_loop: false
    position_feedback: false
    use_stamped_vel: false            # take geometry_msgs/Twist on ~/reference_unstamped
    velocity_rolling_window_size: 10

    # rear pair = traction (velocity), front pair = steering (position)
    rear_wheels_names: [rear_left_wheel_joint, rear_right_wheel_joint]
    front_wheels_names: [front_left_steer_joint, front_right_steer_joint]

    wheelbase: 0.30
    front_wheel_track: 0.26
    rear_wheel_track: 0.26
    front_wheels_radius: 0.05
    rear_wheels_radius: 0.05

    # T2 (the student odometry node) is the SOLE owner of odom -> base_link, so the
    # controller must NOT publish odom or the TF. Never double-publish a transform.
    enable_odom_tf: false
    base_frame_id: base_link
    odom_frame_id: odom

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - arm_yaw_joint
      - arm_shoulder_joint
      - arm_elbow_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    # hold the last commanded pose (behaviors publish sparse trajectories)
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
